# Updates are made upstream and arrive with each release (docs/SUPPLY-CHAIN.md); this file only keeps
# GitHub's dependency graph and security alerts current. It opens no pull requests.
version: 2
updates:
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
